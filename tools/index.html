    <script>
      // Polyfill Node process global for third-party libraries (e.g. TanStack Virtual)
      window.process = window.process || {};
      window.process.env = window.process.env || {};
      if (!window.process.env.NODE_ENV) {
        window.process.env.NODE_ENV = window.__APP_CONFIG__?.devMode ? "development" : "production";
      }
      // Set process.platform from the user agent. This MUST happen here, before
      // any bundle (and therefore vscode-uri) loads. Since we are forced to set
      // windows.process, we must also set process.platform because vscode-uri
      // uses process.platform to determine if the OS is Windows.
      if (!window.process.platform) {
        const ua = navigator.userAgent || "";
        window.process.platform =
          ua.indexOf("Windows") >= 0
            ? "win32"
            : ua.indexOf("Macintosh") >= 0 || ua.indexOf("Mac OS") >= 0
              ? "darwin"
              : "linux";
      }

      // Workaround for mce-autosize-textarea re-definition error from overlay_bundle.js.
      if (window.customElements) {
        const originalDefine = window.customElements.define;
        window.customElements.define = (name, constructor, options) => {
          if (!window.customElements.get(name)) {
            originalDefine.call(window.customElements, name, constructor, options);
          }
        };
      }
